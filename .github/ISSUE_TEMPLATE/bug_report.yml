name: Bug report
description: Report a problem with xGoose for Discourse
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include steps, expected behavior, and actual behavior. Use synthetic examples; never include private forum content or credentials.
    validations:
      required: true
  - type: input
    attributes:
      label: Discourse version and plugin revision
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant errors
      description: Redact API keys, cookies, private messages, and personal data.
